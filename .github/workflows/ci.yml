name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/linkforge_ci"
      BETTER_AUTH_SECRET: "ci-test-better-auth-secret-1234567890"
      BETTER_AUTH_URL: "http://localhost:3000"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      DATABASE_PROVIDER: "postgres"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=critical
      - run: npm run typecheck
      - run: npm run lint
      - run: npx vitest run
      - run: npm run build

# =============================================================================
# 🟠 Cloudflare Pages + D1 config (@opennextjs/cloudflare ke saath)
# Setup: docs/deployment.md → Cloudflare section
# =============================================================================
name = "linkforge"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]
# OpenNext output (opennextjs-cloudflare build) — Pages yahi upload karta hai.
# Purana next-on-pages path (.vercel/output/static) ab use nahi hota.
pages_build_output_dir = ".open-next/assets"

# ---- D1 database binding (DATABASE_PROVIDER=d1) ------------------------------
# [[d1_databases]]
# binding = "DB"
# database_name = "linkforge"
# database_id = "<D1_DATABASE_ID>"

# ---- R2 bucket binding (alternative to S3 API) --------------------------------
# [[r2_buckets]]
# binding = "BUCKET"
# bucket_name = "linkforge"
